name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) and this builds the wheel and
# sdist, checks them, and publishes a GitHub Release with both attached and auto-generated notes.
#
#     git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The Windows exe folder (PyInstaller, ~170 MB zipped): users without Python unpack it and
  # double-click; FEABAS and the deep-learning environments are still created from the Setup page.
  frozen-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the frozen app
        run: |
          python -m pip install -e . pyinstaller
          python -m PyInstaller --noconfirm --clean tools/feabas_workbench.spec
          $exe = Resolve-Path .\dist\FEABAS-Workbench\FEABAS-Workbench.exe
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck", "selfcheck.json" -Wait -PassThru -NoNewWindow
          Get-Content selfcheck.json
          if ($p.ExitCode -ne 0) { throw "selfcheck exit code $($p.ExitCode)" }
          Compress-Archive -Path dist\FEABAS-Workbench -DestinationPath "FEABAS-Workbench-$env:GITHUB_REF_NAME-windows-x64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v7
        with:
          name: frozen-windows
          path: FEABAS-Workbench-*-windows-x64.zip

  release:
    runs-on: ubuntu-latest
    needs: frozen-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject.toml says $v"; exit 1; }

      - name: Build and validate wheel + sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/download-artifact@v8
        with:
          name: frozen-windows
          path: dist/

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FEABAS Workbench ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. Windows without Python: unpack FEABAS-Workbench-*-windows-x64.zip and start FEABAS-Workbench.exe. With Python: pip install <the .whl below>, then run \`feabas-workbench\` or \`python -m feabas_workbench\`. FEABAS and the deep-learning environments are installed from the Setup page in both cases." \
            --generate-notes
