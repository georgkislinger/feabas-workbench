name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) and this builds the wheel and
# sdist, checks them, and publishes a GitHub Release with both attached and auto-generated notes.
#
#     git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject.toml says $v"; exit 1; }

      - name: Build and validate wheel + sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FEABAS Workbench ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. Install with: pip install <the .whl below> (then run \`feabas-workbench\` or \`python -m feabas_workbench\`)." \
            --generate-notes
