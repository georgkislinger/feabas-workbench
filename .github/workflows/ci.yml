name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt run-time libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1 fonts-dejavu-core

      - name: Install the workbench
        run: python -m pip install -e . pytest

      - name: Core and offscreen GUI tests
        run: python -m pytest tests -q

      - name: Render every page offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m feabas_workbench --screenshot screenshots

      - uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.os }}-py${{ matrix.python }}
          path: screenshots/

      - name: Build and validate wheel + sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  feabas-patch:
    name: FEABAS run-time patch applies (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FEABAS as the Setup page would
        run: python -m pip install feabas==3.0.5 tifffile imagecodecs

      # FEABAS reads configs/general_configs.yaml from the working directory, like a project folder.
      - name: stitching_matcher is patched when vendor/winfix is on PYTHONPATH
        env:
          PYTHONPATH: ${{ github.workspace }}/feabas_workbench/vendor/winfix
        run: |
          mkdir -p proj/configs
          printf 'working_directory: %s/proj\nparallel_framework: process\nfull_resolution: 10\nsection_thickness: 50\n' "$PWD" > proj/configs/general_configs.yaml
          cd proj
          python -c "from feabas import matcher, stitcher; assert matcher._feabas_workbench_phtm_fix, 'not patched'; assert stitcher.stitching_matcher is matcher.stitching_matcher, 'stitcher not rebound'; print('FEABAS run-time patch active: OK')"
