name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt run-time libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1 fonts-dejavu-core

      - name: Install the workbench
        run: python -m pip install -e . pytest

      - name: Core and offscreen GUI tests
        run: python -m pytest tests -q

      - name: Render every page offscreen (on a synthetic demo project)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m feabas_workbench.core.synthetic demo_project --sections 3 --tile 256
          python -m feabas_workbench --project demo_project --screenshot screenshots

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}-py${{ matrix.python }}
          path: screenshots/

      - name: Build and validate wheel + sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  feabas-e2e:
    name: FEABAS end-to-end on a synthetic dataset (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FEABAS as the Setup page would, plus the workbench core
        run: |
          python -m pip install feabas==3.0.5 tifffile imagecodecs
          python -m pip install -e .

      # FEABAS reads configs/general_configs.yaml from the working directory, like a project folder.
      - name: stitching_matcher is patched when vendor/winfix is on PYTHONPATH
        env:
          PYTHONPATH: ${{ github.workspace }}/feabas_workbench/vendor/winfix
        run: |
          mkdir -p proj/configs
          printf 'working_directory: %s/proj\nparallel_framework: process\nfull_resolution: 10\nsection_thickness: 50\n' "$PWD" > proj/configs/general_configs.yaml
          cd proj
          python -c "from feabas import matcher, stitcher; assert matcher._feabas_workbench_phtm_fix, 'not patched'; assert stitcher.stitching_matcher is matcher.stitching_matcher, 'stitcher not rebound'; print('FEABAS run-time patch active: OK')"

      # Stitch, thumbnails, coarse and fine alignment, PNG render and mipmaps on 4 synthetic
      # sections of 2x2 tiles - the whole pipeline the GUI drives, through the same vendored scripts.
      - name: Run the whole pipeline on a synthetic dataset
        run: python tools/run_demo_pipeline.py demo --render --timeout 900

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-pipeline-outputs
          path: |
            demo/workbench.log
            demo/thumbnail_align/aligned_thumbnails_*/
            demo/thumbnail_align/thumbnails/
          if-no-files-found: ignore

  frozen-windows:
    name: Frozen Windows build (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the workbench and PyInstaller
        run: python -m pip install -e . pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean tools/feabas_workbench.spec

      # The exe must find its vendored FEABAS scripts, the checkpoint and stage the worker
      # package from inside the bundle, and render every page on a project.
      - name: Self-check and offscreen render of the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m feabas_workbench.core.synthetic demo_project --sections 3 --tile 256
          .\dist\FEABAS-Workbench\FEABAS-Workbench.exe --selfcheck selfcheck.json
          Get-Content selfcheck.json
          .\dist\FEABAS-Workbench\FEABAS-Workbench.exe --project demo_project --screenshot frozen_screenshots
          if ((Get-ChildItem frozen_screenshots).Count -ne 7) { throw "expected 7 page screenshots" }

      - uses: actions/upload-artifact@v7
        with:
          name: frozen-windows-selfcheck
          path: |
            selfcheck.json
            frozen_screenshots/
